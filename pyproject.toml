[project]
name = "p24-agent-node-poc"
version = "0.1.0"
description = ""
authors = [
    {name = "Antonin",email = "antonin@presti.ai"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pandas (>=1.5,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "langchain-openai (>=1.1.10,<2.0.0)",
    "deepagents (>=0.4.4,<0.5.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-experimental (>=0.4.1,<0.5.0)",
    "tavily (>=1.1.0,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pandas-stubs (>=2.3.3,<2.4.0)",
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.32,<1.0)",
    "python-multipart (>=0.0.12,<1.0)",
    "google-cloud-storage (>=2.0,<3.0)",
    "retry (>=0.9.2,<1.0)",
    "firecrawl-py (>=1.0.0,<2.0.0)"
]

[tool.poetry]
name = "p24-agent-node-poc"
version = "0.1.0"
description = "P24 agent node proof of concept for data processing"
authors = ["Antonin <antonin@presti.ai>"]
packages = [{include = "p24_agent_node_poc", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pandas = ">=1.5,<3.0.0"
openpyxl = ">=3.1.5,<4.0.0"
langchain-openai = ">=1.1.10,<2.0.0"
deepagents = ">=0.4.4,<0.5.0"
langchain-community = ">=0.4.1,<0.5.0"
langchain-experimental = ">=0.4.1,<0.5.0"
tavily = ">=1.1.0,<2.0.0"
loguru = ">=0.7.3,<0.8.0"
fastapi = ">=0.115,<1.0"
uvicorn = {extras = ["standard"], version = ">=0.32,<1.0"}
python-multipart = ">=0.0.12,<1.0"
google-cloud-storage = ">=2.0,<3.0"
retry = ">=0.9.2,<1.0"
pandas-stubs = ">=2.3.3,<2.4.0"
langchain-anthropic = "^1.3.4"
firecrawl-py = ">=1.0.0,<2.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
